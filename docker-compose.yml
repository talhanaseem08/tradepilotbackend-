version: "3.8"

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./gateway-service
    ports:
      - "3000:3000"
    env_file:
      - .env
      - ./gateway-service/.env.example
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nlp-service:
    build: ./nlp-service
    ports:
      - "8001:8001"
    env_file:
      - .env
      - ./nlp-service/.env.example
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agent-service:
    build: ./agent-service
    ports:
      - "8003:8003"
    env_file:
      - .env
      - ./agent-service/.env.example
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mongo_data:
