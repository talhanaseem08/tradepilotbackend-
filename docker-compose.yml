version: "3.8"

services:
  mongodb:
    image: mongo:7
    
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
  
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./gateway-service
    ports:
      - "3001:3000"
    env_file:
      - .env
    # Inside Docker, localhost is THIS container — use service DNS names so proxy reaches NLP/trading/agent.
    # These override TRADING_SERVICE_URL etc. from .env when both are set (Compose env wins).
    environment:
      NLP_SERVICE_URL: http://nlp-service:8001
      TRADING_SERVICE_URL: http://trading-service:8002
      AGENT_SERVICE_URL: http://agent-service:8003
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp-service:
        condition: service_started
      trading-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nlp-service:
    build: ./nlp-service
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  trading-service:
    build: ./trading-service
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      NLP_SERVICE_URL: http://nlp-service:8001
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agent-service:
    build: ./agent-service
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      TRADING_SERVICE_URL: http://trading-service:8002
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      trading-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongo_data:
