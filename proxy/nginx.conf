server {
  listen 80;
  server_name _;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/ {
    proxy_pass http://gateway:3000/api/;
  }

  location /socket.io/ {
    proxy_pass http://gateway:3000/socket.io/;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location ^~ /auth/ {
    proxy_pass http://frontend:80;
  }

  location = /app-entry {
    proxy_pass http://frontend:80;
  }

  location ^~ /prompt {
    proxy_pass http://frontend:80;
  }

  location ^~ /welcome {
    proxy_pass http://frontend:80;
  }

  location ^~ /dashboard {
    proxy_pass http://frontend:80;
  }

  location ^~ /my-bots {
    proxy_pass http://frontend:80;
  }

  location ^~ /trade-journal {
    proxy_pass http://frontend:80;
  }

  location ^~ /analytics {
    proxy_pass http://frontend:80;
  }

  location ^~ /backtest {
    proxy_pass http://frontend:80;
  }

  location ^~ /news {
    proxy_pass http://frontend:80;
  }

  location ^~ /settings {
    proxy_pass http://frontend:80;
  }

  location ^~ /company {
    proxy_pass http://frontend:80;
  }

  location ^~ /assets/ {
    proxy_pass http://frontend:80;
  }

  location / {
    proxy_pass http://landing-page:3000;
  }
}
