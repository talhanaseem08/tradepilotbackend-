<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 22px Arial, sans-serif; fill: #1e293b; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 12; ry: 12; }
      .store { fill: #ecfeff; stroke: #155e75; stroke-width: 2; }
      .ext { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; rx: 12; ry: 12; }
      .label { font: 600 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 15px Arial, sans-serif; fill: #334155; }
      .line { stroke: #334155; stroke-width: 2.4; fill: none; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .contract { stroke: #0f172a; stroke-width: 2.4; fill: none; }
      .lol { stroke: #0f172a; stroke-width: 2.4; fill: #ffffff; }
      .note { font: 500 14px Arial, sans-serif; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <text x="60" y="60" class="title">TradePilot Component Diagram (Clean + Lollipop Guide)</text>

  <text x="60" y="105" class="subtitle">A) Clean Component Layout (copy this placement into EdrawMax)</text>

  <rect x="120" y="170" width="240" height="90" class="box"/>
  <text x="180" y="223" class="label">Frontend</text>

  <rect x="470" y="150" width="320" height="120" class="box"/>
  <text x="555" y="220" class="label">Gateway Service</text>

  <rect x="210" y="380" width="310" height="120" class="box"/>
  <text x="288" y="450" class="label">Trading Service</text>

  <rect x="590" y="380" width="260" height="120" class="box"/>
  <text x="665" y="450" class="label">NLP Service</text>

  <rect x="940" y="380" width="300" height="120" class="box"/>
  <text x="1028" y="450" class="label">Agent Service</text>

  <rect x="300" y="620" width="260" height="105" class="store" rx="12" ry="12"/>
  <text x="380" y="682" class="label">MongoDB</text>

  <rect x="680" y="620" width="280" height="105" class="store" rx="12" ry="12"/>
  <text x="770" y="682" class="label">Redis</text>

  <rect x="1110" y="590" width="430" height="190" class="ext"/>
  <text x="1245" y="635" class="label">External APIs</text>
  <text x="1160" y="675" class="small">OANDA, Binance/CCXT, News Sources, Ollama</text>

  <line x1="360" y1="215" x2="470" y2="215" class="arrow"/>

  <line x1="560" y1="270" x2="390" y2="380" class="arrow"/>
  <line x1="640" y1="270" x2="720" y2="380" class="arrow"/>
  <line x1="720" y1="270" x2="1090" y2="380" class="arrow"/>

  <line x1="560" y1="500" x2="430" y2="620" class="arrow"/>
  <line x1="720" y1="500" x2="820" y2="620" class="arrow"/>
  <line x1="380" y1="500" x2="420" y2="620" class="arrow"/>
  <line x1="380" y1="500" x2="760" y2="620" class="arrow"/>
  <line x1="1090" y1="500" x2="450" y2="620" class="arrow"/>
  <line x1="1090" y1="500" x2="850" y2="620" class="arrow"/>

  <line x1="520" y1="440" x2="590" y2="440" class="arrow"/>

  <line x1="520" y1="445" x2="1110" y2="640" class="arrow"/>
  <line x1="850" y1="445" x2="1110" y2="690" class="arrow"/>
  <line x1="1240" y1="445" x2="1110" y2="740" class="arrow"/>

  <text x="375" y="205" class="small">HTTP /api</text>
  <text x="475" y="338" class="small">REST proxy</text>
  <text x="615" y="338" class="small">REST proxy</text>
  <text x="880" y="338" class="small">REST proxy</text>
  <text x="570" y="575" class="small">IMongoStore / IRedisBus</text>
  <text x="530" y="425" class="small">sentiment</text>

  <text x="60" y="865" class="subtitle">B) Lollipop-Socket Wiring (use UML Provided/Required Interface symbols)</text>

  <rect x="70" y="900" width="320" height="70" class="box"/>
  <text x="150" y="944" class="label">Frontend</text>
  <path d="M 390 927 A 10 10 0 0 1 390 947" class="contract"/>
  <line x1="400" y1="937" x2="470" y2="937" class="contract"/>
  <circle cx="480" cy="937" r="10" class="lol"/>
  <line x1="490" y1="937" x2="560" y2="937" class="contract"/>
  <rect x="560" y="900" width="360" height="70" class="box"/>
  <text x="640" y="944" class="label">Gateway Service</text>
  <text x="410" y="920" class="small">IWebFrontDoor</text>

  <rect x="70" y="1000" width="320" height="70" class="box"/>
  <text x="130" y="1044" class="label">Gateway Service</text>
  <path d="M 390 1027 A 10 10 0 0 1 390 1047" class="contract"/>
  <line x1="400" y1="1037" x2="470" y2="1037" class="contract"/>
  <circle cx="480" cy="1037" r="10" class="lol"/>
  <line x1="490" y1="1037" x2="560" y2="1037" class="contract"/>
  <rect x="560" y="1000" width="330" height="70" class="box"/>
  <text x="630" y="1044" class="label">Trading Service</text>
  <text x="425" y="1020" class="small">ITradingApi</text>

  <rect x="940" y="900" width="320" height="70" class="box"/>
  <text x="1000" y="944" class="label">Gateway Service</text>
  <path d="M 1260 927 A 10 10 0 0 1 1260 947" class="contract"/>
  <line x1="1270" y1="937" x2="1340" y2="937" class="contract"/>
  <circle cx="1350" cy="937" r="10" class="lol"/>
  <line x1="1360" y1="937" x2="1430" y2="937" class="contract"/>
  <rect x="1430" y="900" width="260" height="70" class="box"/>
  <text x="1510" y="944" class="label">NLP Service</text>
  <text x="1290" y="920" class="small">INlpApi</text>

  <rect x="940" y="1000" width="320" height="70" class="box"/>
  <text x="1000" y="1044" class="label">Gateway Service</text>
  <path d="M 1260 1027 A 10 10 0 0 1 1260 1047" class="contract"/>
  <line x1="1270" y1="1037" x2="1340" y2="1037" class="contract"/>
  <circle cx="1350" cy="1037" r="10" class="lol"/>
  <line x1="1360" y1="1037" x2="1430" y2="1037" class="contract"/>
  <rect x="1430" y="1000" width="260" height="70" class="box"/>
  <text x="1510" y="1044" class="label">Agent Service</text>
  <text x="1280" y="1020" class="small">IAgentApi</text>

  <text x="70" y="1135" class="note">Socket = Required interface (consumer). Lollipop = Provided interface (provider). Connect socket to lollipop with an assembly connector.</text>
  <text x="70" y="1160" class="note">Add IMongoStore and IRedisBus similarly: MongoDB/Redis provide; Gateway/Trading/NLP/Agent require.</text>
</svg>
