<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intent — TradePilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Design system — editorial fintech, single accent field */
    :root {
      --color-canvas: #e8e4dc;
      --color-canvas-mid: #ddd8cf;
      --color-ink: #14120f;
      --color-ink-soft: #4a4744;
      --color-muted: #7a756f;
      --color-surface: #f7f5f0;
      --color-surface-elevated: #fffcf7;
      --color-accent: #0d5c5c;
      --color-accent-hover: #094a4a;
      --color-accent-muted: rgba(13, 92, 92, 0.12);
      --color-border: rgba(20, 18, 15, 0.1);
      --color-border-strong: rgba(20, 18, 15, 0.16);
      --shadow-composer: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 24px 48px -28px rgba(20, 18, 15, 0.25);
      --focus-ring: 0 0 0 2px var(--color-surface), 0 0 0 4px var(--color-accent);
      --font-display: "Fraunces", Georgia, "Times New Roman", serif;
      --font-ui: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --space-2xl: 3rem;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --content-max: 42rem;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-ui);
      font-size: 1rem;
      line-height: 1.5;
      color: var(--color-ink);
      background-color: var(--color-canvas);
      background-image:
        radial-gradient(ellipse 120% 80% at 50% -20%, rgba(255, 252, 247, 0.9) 0%, transparent 55%),
        radial-gradient(ellipse 60% 50% at 100% 50%, rgba(13, 92, 92, 0.06) 0%, transparent 50%),
        linear-gradient(165deg, var(--color-canvas) 0%, var(--color-canvas-mid) 100%);
    }

    /* Subtle grain — atmosphere without noise libraries */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
      z-index: 0;
    }

    .shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* —— Header —— */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md) var(--space-xl);
      border-bottom: 1px solid var(--color-border);
      background: rgba(247, 245, 240, 0.72);
      backdrop-filter: blur(10px);
    }

    .brand {
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 0.9375rem;
      letter-spacing: -0.03em;
      color: var(--color-ink);
      text-decoration: none;
    }

    .brand-mark {
      color: var(--color-accent);
    }

    .session {
      display: flex;
      align-items: center;
      gap: var(--space-lg);
      font-size: 0.8125rem;
      color: var(--color-muted);
    }

    .session-email {
      max-width: 14rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .link-quiet {
      color: var(--color-accent);
      font-weight: 600;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .link-quiet:hover {
      border-bottom-color: var(--color-accent);
    }

    .link-quiet:focus-visible {
      outline: none;
      border-radius: var(--radius-sm);
      box-shadow: var(--focus-ring);
    }

    /* —— Main — asymmetric column, strong hierarchy — */
    main {
      flex: 1;
      width: 100%;
      max-width: calc(var(--content-max) + 4rem);
      margin: 0 auto;
      padding: var(--space-2xl) var(--space-xl) var(--space-2xl);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--space-xl);
    }

    @media (min-width: 720px) {
      main {
        grid-template-columns: 4px 1fr;
        align-items: start;
        column-gap: var(--space-xl);
      }

      .rail {
        width: 4px;
        min-height: 120px;
        background: linear-gradient(180deg, var(--color-accent) 0%, rgba(13, 92, 92, 0.15) 100%);
        border-radius: 2px;
        margin-top: 0.5rem;
      }
    }

    .hero {
      animation: fadeInUp 0.65s ease-out both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .eyebrow {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: var(--space-sm);
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 4.5vw, 2.375rem);
      font-weight: 600;
      font-variation-settings: "SOFT" 0, "WONK" 0.5;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      max-width: 20ch;
    }

    .lede {
      margin-top: var(--space-md);
      font-size: 1.0625rem;
      color: var(--color-ink-soft);
      max-width: 36ch;
      line-height: 1.55;
    }

    /* —— Composer card — composition: shell + body + footer — */
    .composer-wrap {
      margin-top: var(--space-xl);
      animation: fadeInUp 0.65s ease-out 0.08s both;
    }

    .composer {
      background: var(--color-surface-elevated);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-composer);
      overflow: hidden;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .composer:focus-within {
      border-color: var(--color-accent);
      box-shadow: var(--shadow-composer), 0 0 0 1px var(--color-accent-muted);
    }

    .composer-body {
      padding: var(--space-lg) var(--space-lg) var(--space-md);
    }

    .composer textarea {
      width: 100%;
      min-height: 140px;
      padding: 0;
      font-family: var(--font-ui);
      font-size: 1rem;
      line-height: 1.6;
      color: var(--color-ink);
      background: transparent;
      border: none;
      resize: vertical;
      outline: none;
    }

    .composer textarea::placeholder {
      color: var(--color-muted);
    }

    .composer-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      padding: var(--space-md) var(--space-lg);
      border-top: 1px solid var(--color-border);
      background: rgba(247, 245, 240, 0.5);
    }

    .kbd-hint {
      font-size: 0.75rem;
      color: var(--color-muted);
    }

    .kbd-hint kbd {
      font-family: inherit;
      font-size: 0.6875rem;
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.625rem 1.25rem;
      font-family: var(--font-ui);
      font-size: 0.875rem;
      font-weight: 600;
      color: #fff;
      background: var(--color-accent);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.12s ease;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--color-accent-hover);
    }

    .btn-primary:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary[aria-busy="true"] {
      cursor: wait;
    }

    /* —— Feedback — */
    .alert {
      margin-top: var(--space-md);
      font-size: 0.875rem;
      color: #9f1239;
      display: none;
    }

    .alert[aria-hidden="false"] {
      display: block;
    }

    .output {
      margin-top: var(--space-xl);
      animation: fadeInUp 0.5s ease-out both;
      display: none;
    }

    .output.is-visible {
      display: block;
    }

    .output-label {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: var(--space-sm);
    }

    .output-pre {
      font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, monospace;
      font-size: 0.8125rem;
      line-height: 1.55;
      padding: var(--space-lg);
      background: var(--color-ink);
      color: #e8e4dc;
      border-radius: var(--radius-md);
      overflow: auto;
      max-height: min(360px, 50vh);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .foot {
      margin-top: auto;
      padding: var(--space-lg) var(--space-xl);
      text-align: center;
      font-size: 0.75rem;
      color: var(--color-muted);
    }

    @media (max-width: 719px) {
      .rail {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/prompt.html">Trade<span class="brand-mark">Pilot</span></a>
      <div class="session">
        <span class="session-email" id="emailDisplay" aria-live="polite"></span>
        <a class="link-quiet" href="#" id="logout">Sign out</a>
      </div>
    </header>

    <main>
      <div class="rail" aria-hidden="true"></div>
      <div>
        <header class="hero">
          <p class="eyebrow">Natural language</p>
          <h1>Describe your trade intent.</h1>
          <p class="lede">
            Plain language in — structured intent out. Refine the result in your workflow or send again.
          </p>
        </header>

        <div class="composer-wrap">
          <div class="composer" role="region" aria-label="Trading prompt">
            <div class="composer-body">
              <label for="prompt" class="visually-hidden">Trading prompt</label>
              <textarea
                id="prompt"
                name="prompt"
                aria-describedby="kbd-hint"
                aria-required="true"
                placeholder="Example: Conservative EURUSD on the 1h chart with trend following, defined risk, and stops under recent structure…"
                spellcheck="true"
              ></textarea>
            </div>
            <div class="composer-footer">
              <p id="kbd-hint" class="kbd-hint">
                <kbd>Enter</kbd> send · <kbd>Shift</kbd> + <kbd>Enter</kbd> new line
              </p>
              <button type="button" class="btn-primary" id="send">Send intent</button>
            </div>
          </div>
        </div>

        <p id="err" class="alert" role="alert" aria-live="assertive" aria-hidden="true"></p>

        <section class="output" id="result" aria-labelledby="out-label" aria-live="polite">
          <h2 id="out-label" class="output-label">Parsed intent</h2>
          <pre class="output-pre" id="out"></pre>
        </section>
      </div>
    </main>

    <footer class="foot">TradePilot — intent layer for structured execution</footer>
  </div>

  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <script>
    (function () {
      const API = window.location.origin + "/api";
      const token = sessionStorage.getItem("tp_token");
      if (!token) {
        window.location.href = "/login.html";
        return;
      }

      const email = sessionStorage.getItem("tp_email");
      const emailEl = document.getElementById("emailDisplay");
      if (email) emailEl.textContent = email;

      document.getElementById("logout").addEventListener("click", function (e) {
        e.preventDefault();
        sessionStorage.removeItem("tp_token");
        sessionStorage.removeItem("tp_email");
        window.location.href = "/login.html";
      });

      var promptEl = document.getElementById("prompt");
      var sendBtn = document.getElementById("send");
      var errEl = document.getElementById("err");
      var resultEl = document.getElementById("result");
      var outEl = document.getElementById("out");

      function showErr(msg) {
        errEl.textContent = msg;
        errEl.setAttribute("aria-hidden", "false");
      }

      function clearErr() {
        errEl.textContent = "";
        errEl.setAttribute("aria-hidden", "true");
      }

      function send() {
        var prompt = promptEl.value.trim();
        if (!prompt) {
          showErr("Please enter a prompt first.");
          promptEl.focus();
          return;
        }
        clearErr();
        sendBtn.disabled = true;
        sendBtn.setAttribute("aria-busy", "true");
        resultEl.classList.remove("is-visible");

        fetch(API + "/parse", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + token,
          },
          body: JSON.stringify({ prompt: prompt }),
        })
          .then(function (r) {
            return r.json().then(function (data) {
              return { ok: r.ok, data: data };
            });
          })
          .then(function (res) {
            if (!res.ok) {
              showErr(res.data.error && res.data.error.message ? res.data.error.message : res.data.message || "Request failed");
              return;
            }
            outEl.textContent = JSON.stringify(res.data, null, 2);
            resultEl.classList.add("is-visible");
          })
          .catch(function (e) {
            showErr(e.message || "Network error");
          })
          .finally(function () {
            sendBtn.disabled = false;
            sendBtn.removeAttribute("aria-busy");
          });
      }

      sendBtn.addEventListener("click", send);
      promptEl.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
    })();
  </script>
</body>
</html>
