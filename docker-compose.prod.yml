services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      landing-page:
        condition: service_started
      frontend:
        condition: service_started
      gateway:
        condition: service_started

  landing-page:
    build: ./landing-page
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./gateway-service
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NLP_SERVICE_URL: http://nlp-service:8001
      TRADING_SERVICE_URL: http://trading-service:8002
      AGENT_SERVICE_URL: http://agent-service:8003
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp-service:
        condition: service_started
      trading-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nlp-service:
    build: ./nlp-service
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  trading-service:
    build: ./trading-service
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NLP_SERVICE_URL: http://nlp-service:8001
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agent-service:
    build: ./agent-service
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      TRADING_SERVICE_URL: http://trading-service:8002
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      trading-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongo_data:
